<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prudential Singapore | Family Insurance Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
        }
        
        /* Prudential Singapore Brand Colors */
        :root {
            --pru-red: #e31e24;        /* PMS 485C */
            --pru-grey: #4b5e77;       /* PMS 431C */
            --pru-light-grey: #f1f5f9;
            --pru-white: #ffffff;
            --pru-dark: #0f172a;
            --pru-gold: #f59e0b;
        }

        /* Login Screen - Prudential Style */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--pru-red) 0%, var(--pru-grey) 100%);
            padding: 20px;
        }
        .login-card {
            background: var(--pru-white);
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(227,30,36,0.3);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--pru-red);
        }
        .pru-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--pru-red) 0%, var(--pru-grey) 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-weight: 700;
            color: white;
            font-size: 22px;
            letter-spacing: 2px;
            position: relative;
        }
        .pru-logo::after {
            content: 'PRU';
            position: absolute;
            font-size: 10px;
            bottom: -8px;
            right: 8px;
            color: rgba(255,255,255,0.8);
        }
        .login-title { 
            font-size: 28px; 
            font-weight: 700; 
            color: var(--pru-dark);
            margin-bottom: 8px;
        }
        .login-subtitle { 
            color: var(--pru-grey); 
            font-size: 16px;
            margin-bottom: 32px;
        }
        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }
        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--pru-grey);
            margin-bottom: 8px;
        }
        .input-field {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fafbfc;
        }
        .input-field:focus {
            outline: none;
            border-color: var(--pru-red);
            background: white;
            box-shadow: 0 0 0 3px rgba(227,30,36,0.1);
        }
        .login-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--pru-red) 0%, var(--pru-grey) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .login-btn:hover::before {
            left: 100%;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(227,30,36,0.4);
        }
        .demo-credentials {
            font-size: 13px;
            color: var(--pru-grey);
        }

        /* Report Screen */
        .report-wrapper {
            display: none;
            min-height: 100vh;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-section {
            background: var(--pru-white);
            padding: 48px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            margin-bottom: 40px;
            text-align: center;
            border-top: 8px solid var(--pru-red);
            position: relative;
            overflow: hidden;
        }
        .header-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--pru-red), var(--pru-gold), var(--pru-red));
        }
        .family-photo {
            width: 140px;
            height: 140px;
            border-radius: 24px;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 15px 40px rgba(227,30,36,0.2);
            margin: 0 auto 32px;
            display: block;
        }
        .main-title {
            font-size: 40px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--pru-red) 0%, var(--pru-grey) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        .subtitle-text {
            font-size: 20px;
            color: var(--pru-grey);
            max-width: 800px;
            margin: 0 auto;
            font-weight: 400;
        }
        .profile-card {
            background: linear-gradient(135deg, var(--pru-red) 0%, var(--pru-grey) 100%);
            color: white;
            padding: 28px 40px;
            border-radius: 20px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
